version: 2

updates:
  # The workflow actions. Grouped so a month's updates arrive as one pull
  # request rather than one per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  # devDependencies only — the package ships with no runtime dependencies, so
  # nothing here reaches a consumer. Grouped for the same reason as above, but
  # minor and patch only: each major opens as its own pull request, so one that
  # fails CI cannot hold back the safe updates beside it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: development
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Majors known not to run on this toolchain. Each lifts on the condition
    # beside it; every other major still arrives as its own pull request.
    ignore:
      # TypeScript 7 ships no JavaScript compiler API, which tsup's `dts: true`
      # declaration build calls. Lift when the declaration build no longer
      # depends on that API. 6.x is not held.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # tsup 9 needs Node >=22.18, and `prepare` runs it on every install,
      # including the Node 18 and 20 CI jobs and git-dependency installs. Lift
      # when `engines.node` moves.
      - dependency-name: tsup
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
